<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vehicles Vehicle Rental System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell" id="app-shell">
    <div class="content">
        <h1>Vehicles</h1>
        <div id="alert" class="alert hidden"></div>

        <div class="panel hidden" id="add-panel">
            <h2 style="margin-top:0">Add a vehicle</h2>
            <form id="form-add">
                <div class="field-row">
                    <div>
                        <label>Type</label>
                        <select id="v-type">
                            <option value="car">Car</option>
                            <option value="van">Van</option>
                            <option value="motorcycle">Motorcycle</option>
                        </select>
                    </div>
                    <div>
                        <label>Year</label>
                        <input type="number" id="v-year" required>
                    </div>
                </div>
                <div class="field-row">
                    <div>
                        <label>Brand</label>
                        <input type="text" id="v-brand" required>
                    </div>
                    <div>
                        <label>Model</label>
                        <input type="text" id="v-model" required>
                    </div>
                </div>
                <label>Daily Rate (Rs.)</label>
                <input type="number" step="0.01" min="0.01" id="v-rate" required>
                <div class="btn-row">
                    <button type="submit" class="btn-primary">Add vehicle</button>
                </div>
            </form>
        </div>

        <div class="panel">
            <h2 style="margin-top:0">Fleet</h2>
            <table id="vehicle-table">
                <thead>
                    <tr>
                        <th class="id">ID</th><th>Type</th><th>Brand / Model</th><th>Year</th>
                        <th>Daily Rate</th><th>Status</th><th></th>
                    </tr>
                </thead>
                <tbody id="vehicle-rows"></tbody>
            </table>
            <div id="empty-note" class="empty-note hidden">No vehicles yet.</div>
        </div>
    </div>
</div>

<!-- Edit vehicle (admin) -->
<div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-body">
        <h2 id="edit-title">Edit vehicle</h2>
        <form id="form-edit">
            <input type="hidden" id="e-id">
            <div class="field-row">
                <div><label>Brand</label><input type="text" id="e-brand" required></div>
                <div><label>Model</label><input type="text" id="e-model" required></div>
            </div>
            <div class="field-row">
                <div><label>Year</label><input type="number" id="e-year" required></div>
                <div><label>Daily Rate (Rs.)</label><input type="number" step="0.01" min="0.01" id="e-rate" required></div>
            </div>
            <div class="helper-text">The vehicle type cannot be changed. Remove and re-add the vehicle if the type is wrong.</div>
            <div class="btn-row">
                <button type="button" class="btn-secondary" onclick="closeModal('edit-modal')">Cancel</button>
                <button type="submit" class="btn-primary">Save changes</button>
            </div>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
    renderNav("vehicles.html");
    const user = Session.get();
    const isAdmin = user.role === "ADMIN";
    let vehicles = [];
    if (isAdmin) document.getElementById("add-panel").classList.remove("hidden");

    async function loadVehicles() {
        const { ok, data } = await API.get("/api/vehicles");
        if (!ok) return;
        vehicles = data;
        const rows = document.getElementById("vehicle-rows");
        rows.innerHTML = "";
        document.getElementById("empty-note").classList.toggle("hidden", data.length > 0);

        data.forEach(v => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td class="id">${esc(v.id)}</td>
                <td>${esc(v.type)}</td>
                <td>${esc(v.brand)} ${esc(v.model)}</td>
                <td>${esc(v.year)}</td>
                <td>${money(v.dailyRate)}</td>
                <td><span class="pill ${v.available ? "pill-green" : "pill-red"}">${v.available ? "Available" : "Not available"}</span></td>
                <td>${isAdmin ? `<div class="actions">
                        <button class="btn-secondary" onclick="openEdit('${esc(v.id)}')">Edit</button>
                        <button class="btn-danger" onclick="removeVehicle('${esc(v.id)}')">Remove</button>
                    </div>` : ""}</td>
            `;
            rows.appendChild(tr);
        });
    }

    document.getElementById("form-add").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
            type: document.getElementById("v-type").value,
            brand: document.getElementById("v-brand").value.trim(),
            model: document.getElementById("v-model").value.trim(),
            year: document.getElementById("v-year").value,
            dailyRate: document.getElementById("v-rate").value,
        };
        const { ok, data } = await API.post("/api/vehicles", payload);
        if (ok && data.success) {
            showAlert("alert", `Added ${data.vehicle.brand} ${data.vehicle.model} (${data.vehicle.id}).`, "success");
            e.target.reset();
            loadVehicles();
        } else {
            showAlert("alert", data.message || "Could not add vehicle.", "error");
        }
    });

    function openEdit(id) {
        const v = vehicles.find(x => x.id === id);
        if (!v) return;
        document.getElementById("edit-title").textContent = `Edit ${v.id} (${v.type})`;
        document.getElementById("e-id").value = v.id;
        document.getElementById("e-brand").value = v.brand;
        document.getElementById("e-model").value = v.model;
        document.getElementById("e-year").value = v.year;
        document.getElementById("e-rate").value = v.dailyRate;
        openModal("edit-modal");
    }

    document.getElementById("form-edit").addEventListener("submit", async (e) => {
        e.preventDefault();
        const { ok, data } = await API.post("/api/vehicles/update", {
            id: document.getElementById("e-id").value,
            brand: document.getElementById("e-brand").value.trim(),
            model: document.getElementById("e-model").value.trim(),
            year: document.getElementById("e-year").value,
            dailyRate: document.getElementById("e-rate").value,
        });
        closeModal("edit-modal");
        if (ok && data.success) {
            showAlert("alert", `Updated ${data.vehicle.id}.`, "success");
            loadVehicles();
        } else {
            showAlert("alert", data.message || "Could not update vehicle.", "error");
        }
    });

    async function removeVehicle(id) {
        if (!confirm("Remove vehicle " + id + "?")) return;
        const { ok, data } = await API.post("/api/vehicles/delete", { id });
        if (ok && data.success) {
            showAlert("alert", `Removed ${id}.`, "success");
            loadVehicles();
        } else {
            showAlert("alert", data.message || "Could not remove vehicle.", "error");
        }
    }

    loadVehicles();
</script>
</body>
</html>

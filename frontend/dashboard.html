<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard — Vehicle Rental System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .vehicle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 15px; }
        .vehicle-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; }
        .vehicle-card h3 { margin: 0 0 4px; font-size: 1.2rem; }
        .vehicle-card .price { font-size: 1.3rem; font-weight: 700; color: var(--accent); margin: 12px 0; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-body { background: #fff; padding: 24px; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        pre.receipt-box { font-family: monospace; background: #f8f9fa; border: 1px solid #e3e7ed; padding: 14px; border-radius: 8px; white-space: pre-wrap; font-size: 0.82rem; }
    </style>
</head>
<body>
<div class="app-shell" id="app-shell">
    <div class="content">
        <h1>Welcome back<span id="welcome-name"></span></h1>
        <p class="empty-note" id="role-note"></p>

        <div id="alert" class="alert hidden"></div>

        <!-- Admin View -->
        <div id="admin-view" class="hidden">
            <div id="summary" class="stats"></div>
        </div>

        <!-- Customer View -->
        <div id="customer-view" class="hidden">
            <h2>Available Vehicles for Rent</h2>
            <div id="vehicle-grid" class="vehicle-grid"></div>
            <div id="no-vehicles" class="empty-note hidden">No vehicles currently available for rent.</div>
        </div>
    </div>
</div>

<!-- Booking & Payment Modal for Customer -->
<div id="booking-modal" class="modal-overlay hidden">
    <div class="modal-body">
        <h2 id="modal-vehicle-title" style="margin-top:0">Rent Vehicle</h2>
        <form id="form-customer-book">
            <input type="hidden" id="modal-vehicle-id">
            <div class="field-row">
                <div>
                    <label>Start Date</label>
                    <input type="date" id="b-start-date" required>
                </div>
                <div>
                    <label>Days</label>
                    <input type="number" id="b-days" min="1" value="1" required oninput="updateCalculatedTotal()">
                </div>
            </div>

            <div style="margin: 15px 0; padding: 12px; background: var(--bg); border-radius: 8px;">
                <span class="helper-text">Estimated Total Cost:</span>
                <div id="calculated-total" style="font-size: 1.4rem; font-weight: 700; color: var(--ink);">Rs.0.00</div>
            </div>

            <label>Payment Method</label>
            <select id="p-method" onchange="toggleCardField(this.value)">
                <option value="Card">Card</option>
                <option value="Cash">Cash</option>
                <option value="Bank Transfer">Bank Transfer</option>
            </select>

            <div id="card-field" style="margin-top: 10px;">
                <label>Card Number (Simulated)</label>
                <input type="text" id="p-card-no" placeholder="4111 1111 1111 1234">
            </div>

            <div class="btn-row" style="margin-top: 20px;">
                <button type="button" class="btn-secondary" onclick="closeBookingModal()">Cancel</button>
                <button type="submit" class="btn-primary">Pay & Confirm Booking</button>
            </div>
        </form>
    </div>
</div>

<!-- Text Receipt Output Modal -->
<div id="receipt-modal" class="modal-overlay hidden">
    <div class="modal-body">
        <h2 style="margin-top:0">Booking Confirmed!</h2>
        <p class="helper-text">Your receipt was generated by the backend:</p>
        <pre id="receipt-content" class="receipt-box"></pre>
        <div class="btn-row" style="margin-top: 15px;">
            <button class="btn-primary" onclick="closeReceiptModal()">Done</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
    renderNav("dashboard.html");
    const user = Session.get();
    let availableVehiclesList = [];
    let selectedVehicleRate = 0;

    document.getElementById("welcome-name").textContent = ", " + user.username;

    if (user.role === "ADMIN") {
        document.getElementById("role-note").textContent = "You're signed in as an admin — managing fleet operations, users, and financial reports.";
        document.getElementById("admin-view").classList.remove("hidden");
        loadAdminDashboard();
    } else {
        document.getElementById("role-note").textContent = "Browse available vehicles below, book your ride, and make payments directly.";
        document.getElementById("customer-view").classList.remove("hidden");
        loadCustomerDashboard();
    }

    async function loadAdminDashboard() {
        const { ok, data } = await API.get("/api/reports");
        if (!ok) return;
        const mr = data.mostRentedVehicle ? data.mostRentedVehicle.brand + " " + data.mostRentedVehicle.model : "None yet";
        document.getElementById("summary").innerHTML = `
            <div class="stat hero"><div class="label">Total revenue</div><div class="value">Rs.${data.totalRevenue.toFixed(2)}</div></div>
            <div class="stat"><div class="label">Available vehicles</div><div class="value">${data.availableVehicles} <small>of ${data.totalVehicles}</small></div></div>
            <div class="stat"><div class="label">Pending maintenance</div><div class="value">${data.pendingMaintenance}</div></div>
            <div class="stat"><div class="label">Most rented</div><div class="value" style="font-size:1.2rem">${mr}</div></div>
        `;
    }

    async function loadCustomerDashboard() {
        const { ok, data } = await API.get("/api/vehicles");
        if (!ok) return;

        availableVehiclesList = data.filter(v => v.available || v.status === "AVAILABLE");
        const grid = document.getElementById("vehicle-grid");
        grid.innerHTML = "";

        document.getElementById("no-vehicles").classList.toggle("hidden", availableVehiclesList.length > 0);

        availableVehiclesList.forEach(v => {
            const card = document.createElement("div");
            card.className = "vehicle-card";
            card.innerHTML = `
                <div>
                    <span class="pill pill-green" style="margin-bottom:8px;">${v.type.toUpperCase()}</span>
                    <h3>${v.brand} ${v.model}</h3>
                    <div class="helper-text">Year: ${v.year}</div>
                </div>
                <div class="price">Rs.${v.dailyRate.toFixed(2)} <small style="font-size:0.8rem; color:var(--muted);">/ day</small></div>
                <button class="btn-primary" onclick="openBookingModal('${v.id || v.vehicleId}')">Book & Pay</button>
            `;
            grid.appendChild(card);
        });
    }

    function openBookingModal(vehicleId) {
        const v = availableVehiclesList.find(x => (x.id || x.vehicleId) === vehicleId);
        if (!v) return;

        selectedVehicleRate = v.dailyRate;
        document.getElementById("modal-vehicle-id").value = vehicleId;
        document.getElementById("modal-vehicle-title").textContent = `Book ${v.brand} ${v.model}`;
        document.getElementById("b-start-date").value = new Date().toISOString().split('T')[0];
        document.getElementById("b-days").value = 1;

        updateCalculatedTotal();
        document.getElementById("booking-modal").classList.remove("hidden");
    }

    function updateCalculatedTotal() {
        const days = parseInt(document.getElementById("b-days").value) || 1;
        document.getElementById("calculated-total").textContent = `Rs.${(selectedVehicleRate * days).toFixed(2)}`;
    }

    function toggleCardField(method) {
        document.getElementById("card-field").classList.toggle("hidden", method !== "Card");
    }

    function closeBookingModal() {
        document.getElementById("booking-modal").classList.add("hidden");
    }

    document.getElementById("form-customer-book").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const payload = {
            customerId: user.id,          // <-- add this
            vehicleId: document.getElementById("modal-vehicle-id").value,
            startDate: document.getElementById("b-start-date").value,
            days: document.getElementById("b-days").value,
            method: document.getElementById("p-method").value,
            cardNumber: document.getElementById("p-card-no").value
        };

        // Backend Java handles booking creation, payment execution, and text receipt generation
        const { ok, data } = await API.post("/api/bookings", payload);
        if (ok && data.receipt) {
            closeBookingModal();
            document.getElementById("receipt-content").textContent = data.receipt;
            document.getElementById("receipt-modal").classList.remove("hidden");
            loadCustomerDashboard();
        } else {
            showAlert("alert", data.message || "Failed to process booking and payment.", "error");
        }
    });

    function closeReceiptModal() {
        document.getElementById("receipt-modal").classList.add("hidden");
    }
</script>
</body>
</html>
